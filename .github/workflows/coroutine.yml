name: coroutine

# Builds rusty_v8 at this branch's tag with coroutine/coroutine-local.patch
# applied. Every push and pull request builds and tests all four targets; a
# `v*-coroutine.*` tag also publishes them as a release, only once every target
# passed. See coroutine/README.md.

on:
  push:
    branches: [coroutine]
    tags: ["v*-coroutine.*"]
  pull_request:
    branches: [coroutine]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coroutine-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          # Cross-compiled like upstream rusty_v8 (V8's DEPS has no arm64 Linux
          # Rust toolchain); the test-linux-arm64 job runs the suite natively.
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            test: false
          - os: macos-15
            target: aarch64-apple-darwin
            test: true
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            test: true
    env:
      V8_FROM_SOURCE: 1
      TARGET: ${{ matrix.target }}
      V8_LIB: ${{ contains(matrix.target, 'windows') && 'rusty_v8' || 'librusty_v8' }}
      V8_LIB_EXT: ${{ contains(matrix.target, 'windows') && 'lib' || 'a' }}
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF: a CRLF checkout of the patch or of V8 makes `git apply` reject every hunk.
      - name: Configure git
        run: git config --global core.symlinks true && git config --global core.autocrlf false

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Download tools/win
        if: runner.os == 'Windows'
        run: |
          mkdir -p tools/win
          curl -fL --retry 3 "https://chromium.googlesource.com/chromium/src/tools/win/+archive/$(git ls-tree HEAD tools/win | awk '{print $3}').tar.gz" |
            tar -xz -C tools/win

      - name: Apply the coroutine-local patch
        run: bash coroutine/apply.sh

      - name: Check every V8 thread_local is classified
        run: bash coroutine/check-thread-locals.sh

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Install the aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            g++-10-aarch64-linux-gnu gcc-10-aarch64-linux-gnu libc6-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc-10" >> "$GITHUB_ENV"

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-21.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*'
          sudo apt-get install -y lld-21 clang-21 libclang-21-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Install Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LIBCLANG_PATH=$(brew --prefix llvm@21)/lib" >> "$GITHUB_ENV"

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: v8-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'build.rs', '.gn', 'git_submodule_status.txt', 'coroutine/coroutine-local.patch') }}
          restore-keys: v8-${{ matrix.target }}-

      - name: Install and start sccache
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ github.workspace }}/target/sccache
          SCCACHE_CACHE_SIZE: 2G
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          $version = "v0.8.2"
          $platform =
            @{ "aarch64-apple-darwin"      = "aarch64-apple-darwin"
               "x86_64-unknown-linux-gnu"  = "x86_64-unknown-linux-musl"
               "aarch64-unknown-linux-gnu" = "x86_64-unknown-linux-musl"
               "x86_64-pc-windows-msvc"    = "x86_64-pc-windows-msvc"
             }['${{ matrix.target }}']
          $basename = "sccache-$version-$platform"
          $url = "https://github.com/mozilla/sccache/releases/download/$version/$basename.tar.gz"
          cd ~
          curl -LO $url
          tar -xzvf "$basename.tar.gz"
          . $basename/sccache --start-server
          echo "$(pwd)/$basename" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          # The V8 build is silent for long stretches: report progress.
          gn_out=target/$TARGET/release/gn_out
          (while sleep 300; do
            echo "heartbeat $(date -u +%T): ninja steps done $(wc -l < "$gn_out/.ninja_log" 2>/dev/null || echo 0), free disk $(df -h . | awk 'NR==2 {print $4}')"
          done) &
          heartbeat=$!
          trap 'kill $heartbeat 2>/dev/null' EXIT
          cargo build -v --locked --release --target "$TARGET" --all-targets

      - name: Test
        if: matrix.test
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: cargo nextest run --all-targets --locked --release --target "$TARGET" --no-fail-fast

      - name: Package the archive, binding and license notices
        run: |
          gn_out=target/$TARGET/release/gn_out
          mkdir -p assets
          gzip -9c "$gn_out/obj/$V8_LIB.$V8_LIB_EXT" > "assets/${V8_LIB}_release_$TARGET.$V8_LIB_EXT.gz"
          cp "$gn_out/src_binding.rs" "assets/src_binding_release_$TARGET.rs"
          # Shipping the static library must carry V8's license and the notices
          # of the third-party code built into it (ICU, abseil and others).
          # Written to stdout: tar reads a `D:\...` file name on Windows as a remote `host:file`.
          find . \( -name .git -o -path ./target -o -path ./assets \) -prune -o -type f \
            \( -name 'LICENSE*' -o -name 'COPYING*' -o -name 'NOTICE*' \) -print0 |
            tar --null -T - -cz -f - > "assets/licenses_$TARGET.tar.gz"
          if command -v sha256sum >/dev/null; then sha=sha256sum; else sha="shasum -a 256"; fi
          (cd assets && $sha ./* > "SHA256SUMS_$TARGET")
          ls -l assets

      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: v8-${{ matrix.target }}
          path: assets/*
          retention-days: 7
          if-no-files-found: error

  test-linux-arm64:
    name: test aarch64-unknown-linux-gnu
    needs: build
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Download the cross-built archive
        uses: actions/download-artifact@v4
        with:
          name: v8-aarch64-unknown-linux-gnu
          path: assets

      - name: Test against the cross-built archive
        env:
          RUSTY_V8_ARCHIVE: ${{ github.workspace }}/assets/librusty_v8_release_aarch64-unknown-linux-gnu.a.gz
          RUSTY_V8_SRC_BINDING_PATH: ${{ github.workspace }}/assets/src_binding_release_aarch64-unknown-linux-gnu.rs
        run: cargo nextest run --all-targets --locked --release --no-fail-fast

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test-linux-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download every target's assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: v8-*
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd assets
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            sha256sum -c "SHA256SUMS_$target"
          done
          test "$(ls | wc -l)" = 16
          # A released tag is final: never replace the assets of a published one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released"
            exit 1
          fi
          gh release create "$TAG" ./* --verify-tag --latest=false --title "$TAG" \
            --notes "rusty_v8 ${TAG%%-coroutine.*} with coroutine/coroutine-local.patch. Tested archives for Linux x64, Linux arm64, macOS Apple Silicon and Windows x64, with their Rust bindings, SHA-256 checksums and license notices. Commit $GITHUB_SHA."
